    <style>
        .portfolio-filters {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }
        .filter-btn {
            background: none;
            border: none;
            font-family: var(--font-body);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-gray);
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .filter-btn.active, .filter-btn:hover { color: var(--color-dark); }
        
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: var(--spacing-sm);
        }
        .masonry-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            aspect-ratio: 3/4;
            display: block;
        }
        .masonry-item.wide { aspect-ratio: 4/3; }
        .masonry-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }
        .masonry-item:hover img { transform: scale(1.05); }
        .masonry-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            color: var(--color-white);
            text-align: center;
            padding: 1rem;
        }
        .masonry-item:hover .masonry-overlay { opacity: 1; }
        .hidden-item { display: none !important; }
        
        /* Lightbox */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .lightbox-img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            user-select: none;
        }
        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            padding: 1rem;
        }
        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

                { img: 'images/BABY%20SHOWER/VANA0768.webp', cat: 'wedding', title: 'Baby shower', class: 'wide' },

                { img: 'images/BABY%20THEME/036A6428.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/036A6506.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/036A6535.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/036A6544.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/4G7A2495.webp', cat: 'wedding', title: 'Baby theme', class: 'wide' },
                { img: 'images/BABY%20THEME/4G7A2613.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/4G7A2623.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/4G7A2708.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/IMG_7433.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/IMG_7511.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/BABY%20THEME/IMG_7623.webp', cat: 'wedding', title: 'Baby theme', class: 'wide' },
                { img: 'images/BABY%20THEME/IMG_7705.webp', cat: 'wedding', title: 'Baby theme', class: '' },

                { img: 'images/BABY%20THEME/IMG_9789.webp', cat: 'wedding', title: 'Baby theme', class: '' },
                { img: 'images/baratham/VANA0046.webp', cat: 'wedding', title: 'Baratham', class: '' },
                { img: 'images/baratham/VANA0052.webp', cat: 'wedding', title: 'Baratham', class: '' },
                { img: 'images/baratham/VANA0061.webp', cat: 'wedding', title: 'Baratham', class: 'wide' },
                { img: 'images/baratham/VANA0525.webp', cat: 'wedding', title: 'Baratham', class: '' },
                { img: 'images/baratham/VANA0536.webp', cat: 'wedding', title: 'Baratham', class: '' },
                { img: 'images/baratham/VANA0539.webp', cat: 'wedding', title: 'Baratham', class: '' },
            ];

            const grid = document.getElementById('portfolio-grid');
            
            // Populate
            portfolioData.forEach((item, index) => {
                const el = document.createElement('a');
                el.href = 'portfolio-detail.html';
                el.className = `masonry-item ${item.class} fade-up`;
                el.dataset.category = item.cat;
                el.dataset.index = index;
                
                const imgSrc = item.img.includes('unsplash.com') ? `${item.img}?auto=format&fit=crop&w=800&q=80` : item.img;
                el.innerHTML = `
                    <img src="${imgSrc}" alt="${item.title}" loading="lazy" decoding="async">
                    <div class="masonry-overlay">
                        <h4>${item.title}</h4>
                        <p class="text-uppercase" style="font-size:0.75rem; margin-top:0.5rem">${item.cat}</p>
                    </div>
                `;
                
                // Lightbox logic
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    openLightbox(index);
                });
                
                grid.appendChild(el);
            });
            
            // Filtering
            const filters = document.querySelectorAll('.filter-btn');
            const items = document.querySelectorAll('.masonry-item');
            
            filters.forEach(btn => {
                btn.addEventListener('click', () => {
                    filters.forEach(f => f.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const filter = btn.dataset.filter;
                    items.forEach(item => {
                        if (filter === 'all' || item.dataset.category === filter) {
                            item.classList.remove('hidden-item');
                        } else {
                            item.classList.add('hidden-item');
                        }
                    });
                });
            });

            // Lightbox
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            let currentIdx = 0;

            function openLightbox(index) {
                currentIdx = index;
                const lightSrc = portfolioData[currentIdx].img.includes('unsplash.com') ? `${portfolioData[currentIdx].img}?auto=format&fit=crop&w=1920&q=90` : portfolioData[currentIdx].img;
                lightboxImg.src = lightSrc;
                lightbox.classList.add('active');
            }

            document.getElementById('lightbox-close').addEventListener('click', () => {
                lightbox.classList.remove('active');
            });
            
            document.getElementById('lightbox-prev').addEventListener('click', () => {
                currentIdx = (currentIdx - 1 + portfolioData.length) % portfolioData.length;
                openLightbox(currentIdx);
            });

            document.getElementById('lightbox-next').addEventListener('click', () => {
                currentIdx = (currentIdx + 1) % portfolioData.length;
                openLightbox(currentIdx);
            });
        });
    </script>
