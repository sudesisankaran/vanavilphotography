<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arjun & Priya | VANAVIL PHOTOGRAPHY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .detail-header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 4rem;
        }
        .detail-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-gray);
        }
        .gallery-grid {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                column-count: 2;
            }
        }
        @media (min-width: 1024px) {
            .gallery-grid {
                column-count: 3;
            }
        }
        .gallery-grid img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            margin-bottom: 1rem;
            break-inside: avoid;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="header-container">
            <a href="index.html" class="logo"><img src="images/005%20copy.png" alt="Vanavil Photography"></a>
            <nav class="nav-desktop">
                <a href="index.html" class="nav-link">Home</a>
                <a href="portfolio.html" class="nav-link active">Portfolio</a>
                <a href="booking.html" class="nav-link">Contact</a>
            </nav>
            <a href="booking.html" class="btn-nav">Check Availability</a>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>

    <div class="page-hero">
        <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5039.webp" alt="Beautiful Wedding Celebration" class="page-hero-bg" fetchpriority="high">
    </div>

    <section class="section">
        <div class="container">
            <div class="detail-header fade-up">
                <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem;">Beautiful Wedding Celebration</h1>
                <div class="detail-meta">
                    <span>2026</span>
                    <span>Wedding</span>
                </div>
                <p>A beautiful celebration of love. We focused on capturing the raw emotions and the vibrant colors that made this day so special.</p>
            </div>
            
            <div class="gallery-grid">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5039.webp" alt="Detail 1" class="wide fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5338.webp" alt="Detail 2" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5345.webp" alt="Detail 3" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5352.webp" alt="Detail 4" class="wide fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A5496.webp" alt="Detail 5" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A9624.webp" alt="Detail 6" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A9681.webp" alt="Detail 7" class="wide fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A9715.webp" alt="Detail 8" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A9718.webp" alt="Detail 9" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/0M5A9724.webp" alt="Detail 10" class="wide fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4910.webp" alt="Detail 11" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4922.webp" alt="Detail 12" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4934.webp" alt="Detail 13" class="wide fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4947.webp" alt="Detail 14" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4951.webp" alt="Detail 15" class="fade-up" loading="lazy" decoding="async">
                <img src="images/wedding-20260904T101936Z-1-001/wedding/180A4957.webp" alt="Detail 16" class="wide fade-up" loading="lazy" decoding="async">
            </div>
        </div>
    </section>

    <section class="section section-dark text-center">
        <div class="container fade-up">
            <h2 style="margin-bottom: 2rem;">Your Story Could Be Next.</h2>
            <a href="booking.html" class="btn btn-primary" style="background-color: var(--color-white); color: var(--color-dark);">Check Availability</a>
        </div>
    </section>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2026 Vanavil Photography.</p>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/animations.js" defer></script>
</body>
</html>
