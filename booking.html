<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Date | VANAVIL PHOTOGRAPHY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Inter:wght@300;400;500&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .booking-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }
        .services-checkboxes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }
        @media (max-width: 767px) {
            .services-checkboxes {
                grid-template-columns: 1fr;
            }
            .booking-container {
                padding: 1.5rem;
            }
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .checkbox-label input {
            margin-right: 10px;
        }
        .success-modal {
            text-align: center;
            padding: 3rem;
            background: white;
        }
        .success-icon {
            font-size: 4rem;
            color: var(--color-gold);
            margin-bottom: 1rem;
        }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/005%20copy.png">
</head>
<body style="background-color: var(--color-off-white);">
    <header class="header" id="header" style="background-color: var(--color-dark);">
        <div class="header-container">
            <a href="index.html" class="logo"><img src="images/005 copy-768.webp" alt="Vanavil Photography" srcset="images/005 copy-480.webp 480w, images/005 copy-768.webp 768w, images/005 copy-1200.webp 1200w, images/005 copy-1600.webp 1600w, images/005 copy-optimized.webp 2000w" sizes="(max-width: 768px) 100vw, (max-width: 1200px) 50vw, 33vw" loading="lazy" decoding="async"></a>
            <nav class="nav-desktop">
                <a href="index.html" class="nav-link">Home</a>
                <a href="services.html" class="nav-link">Services</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </div>
    </header>

    <section class="section" style="padding-top: calc(var(--header-height) + 4rem);">
        <div class="container">
            <div class="booking-container fade-up">
                <h1 style="text-align: center; margin-bottom: 2rem;">Check Your Date</h1>
                
                <form id="bookingForm">
                    <div class="grid grid-2 gap-sm">
                        <div class="form-group">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="fullName" required="">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone *</label>
                            <input type="tel" class="form-control" id="phone" required="">
                        </div>
                    </div>
                    
                    <div class="grid grid-2 gap-sm">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Event Type *</label>
                            <input type="text" class="form-control" id="eventType" required="">
                        </div>
                    </div>
                    
                    <div class="grid grid-2 gap-sm">
                        <div class="form-group">
                            <label class="form-label">Wedding Date *</label>
                            <input type="date" class="form-control" id="weddingDate" required="">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Event Location *</label>
                            <input type="text" class="form-control" id="location" required="">
                        </div>
                    </div>
                    
                    <div class="grid grid-2 gap-sm">
                        <div class="form-group">
                            <label class="form-label">Guest Count</label>
                            <input type="number" class="form-control" id="guests">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Budget Range</label>
                            <select class="form-control" id="budget">
                                <option value="">Select Range</option>
                                <option value="essential">Essential</option>
                                <option value="signature">Signature</option>
                                <option value="luxury">Luxury</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 1rem;">
                        <label class="form-label">Services Required *</label>
                        <div class="services-checkboxes" id="servicesRequired">
                            <label class="checkbox-label"><input type="checkbox" value="Wedding Photography"> Wedding Photography</label>
                            <label class="checkbox-label"><input type="checkbox" value="Candid Photography"> Candid Photography</label>
                            <label class="checkbox-label"><input type="checkbox" value="Cinematic Video"> Cinematic Video</label>
                            <label class="checkbox-label"><input type="checkbox" value="Pre-Wedding"> Pre-Wedding</label>
                            <label class="checkbox-label"><input type="checkbox" value="Post-Wedding"> Post-Wedding</label>
                            <label class="checkbox-label"><input type="checkbox" value="Drone"> Drone</label>
                            <label class="checkbox-label"><input type="checkbox" value="LED Wall"> LED Wall</label>
                            <label class="checkbox-label"><input type="checkbox" value="Live Stream"> Live Stream</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="message" placeholder="Tell us more about your celebration..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Submit Enquiry</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Success Modal -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-content success-modal" style="width: 90%; max-width: 500px;">
            <div class="success-icon">✓</div>
            <h2 style="margin-bottom: 1rem;">Thank you!</h2>
            <p style="margin-bottom: 2rem;">We've received your enquiry and will get back to you shortly to discuss your big day.</p>
            <div class="flex flex-col gap-sm">
                <a href="https://wa.me/919994499388" target="_blank" class="btn btn-primary">WhatsApp Us</a>
                <a href="tel:+919994499388" class="btn btn-outline">Call Us</a>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer=""></script>
    <script src="js/animations.js" defer=""></script>
    <script src="js/booking.js" defer=""></script>

    <!-- Floating Socials -->
    <div class="floating-socials">
        <a href="https://www.instagram.com/vanavil_photography?igsi=OWdrbGJuZHc0czBw&amp;utm_source=ig_contact_invite" target="_blank" class="social-icon instagram" aria-label="Instagram">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"></path></svg>
        </a>
        <a href="https://youtube.com/" target="_blank" class="social-icon youtube" aria-label="YouTube">
            <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.5 12 3.5 12 3.5s-7.505 0-9.377.55a3.016 3.016 0 0 0-2.122 2.136C0 8.07 0 12 0 12s0 3.93.501 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.55 9.377.55 9.377.55s7.505 0 9.377-.55a3.016 3.016 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"></path></svg>
        </a>
    </div>


</body></html>
